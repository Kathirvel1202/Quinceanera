<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Quinceañera &amp; Sweet Sixteen Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body data-page="signup">
    <main>
        <section class="auth-section">
            <img class="auth-backdrop" src="images/pexels-33438719.jpg" alt="Quinceañera celebrant posing in formal attire">
            <div class="auth-card">
                <a class="auth-back-link" href="index.html"><span aria-hidden="true">←</span> Back to home</a>
                <nav class="auth-tabs" aria-label="Account pages">
                    <a class="auth-tab" href="login.html">Log in</a>
                    <a class="auth-tab" href="signup.html" aria-current="page">Register</a>
                </nav>
                <p class="eyebrow">CREATE YOUR ACCOUNT</p>
                <h1>Start planning together</h1>
                <p class="auth-intro">Set up an account for your celebration planning workspace.</p>
                <form class="auth-form demo-form">
                    <div class="field">
                        <label for="signupName">Your name</label>
                        <input id="signupName" name="name" type="text" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="signupEmail">Email address</label>
                        <input id="signupEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                    <div class="field">
                        <label for="signupPassword">Create a password</label>
                        <div class="password-control">
                            <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
                            <button class="password-toggle" type="button" data-password-toggle aria-controls="signupPassword" aria-label="Show password" aria-pressed="false"></button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm password</label>
                        <div class="password-control">
                            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                            <button class="password-toggle" type="button" data-password-toggle aria-controls="confirmPassword" aria-label="Show password" aria-pressed="false"></button>
                        </div>
                    </div>
                    <div class="field"><label class="terms-label"><input type="checkbox" name="terms" required><span>I agree to the account terms.</span></label></div>
                    <button class="button auth-submit" type="submit">Create account</button>
                    <p class="form-confirmation" hidden>This is a front-end demo. Connect an account service to save new accounts.</p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
